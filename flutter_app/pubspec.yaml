name: nabha_healthcare
description: A comprehensive healthcare mobile application for Nabha Healthcare providing video consultation, pharmacy services, and health management.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2

  # Payment
  razorpay_flutter: ^1.3.6

  # Local Storage
  shared_preferences: ^2.2.2

  # Authentication & Security
  local_auth: ^2.3.0
  crypto: ^3.0.3
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.5

  # Communication
  permission_handler: ^12.0.1
  url_launcher: ^6.2.1

  # Location & Maps
  geolocator: ^14.0.2

  # Media & Files
  image_picker: ^1.0.4
  path_provider: ^2.1.1

  # Date & Time
  intl: ^0.20.2

  # Animations
  lottie: ^3.3.2
  animations: ^2.0.8

  # Utils
  share_plus: ^12.0.1
  device_info_plus: ^12.2.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logoo.jpg"
    background_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/logoo.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logoo.jpg"
  image_path: "assets/images/logoo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logoo.jpg"
  remove_alpha_ios: true
  min_sdk_android: 21
